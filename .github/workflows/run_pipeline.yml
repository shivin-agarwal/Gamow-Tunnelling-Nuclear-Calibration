name: Execute Nuclear Physics Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository files
      uses: actions/checkout@v4

    - name: Set up cloud Python environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install computing dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy pandas scipy matplotlib

    - name: Run complete data pipeline scripts
      run: |
        python src/01_build_dataset.py
        python src/02_gamow_model.py
        python src/03_fit_preformation.py
        python src/06_generate_final_figures.py

    - name: Archive compiled physics figures
      uses: actions/upload-artifact@v4
      with:
        name: publication-graphics-suite
        path: output/
